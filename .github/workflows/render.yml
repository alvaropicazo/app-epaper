name: Generate ePaper Display

on:
  schedule:
    # 10:17 UTC = 5:17 AM Central Daylight Time
    # 11:17 UTC = 5:17 AM Central Standard Time
    # The local-time guard below makes exactly one run proceed each day.
    - cron: "17 10,11 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "render.py"
      - "render_periods.py"
      - "panel_export.py"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago

    steps:
      - name: Check scheduled run time
        id: time_check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ "$(date +%H)" == "05" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the 5 AM Chicago run; skipping the duplicate UTC schedule."
          fi

      - name: Check out repository
        if: steps.time_check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.time_check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.time_check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate the legacy display and four period frames
        if: steps.time_check.outputs.run == 'true'
        run: |
          mkdir -p output
          python render.py --out output/display.png
          python render_periods.py --out-dir output

      - name: Publish generated frames
        if: steps.time_check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/display.png output/display.bin \
            output/morning.png output/morning.bin \
            output/afternoon.png output/afternoon.bin \
            output/evening.png output/evening.bin \
            output/night.png output/night.bin

          if git diff --cached --quiet; then
            echo "Generated frames are unchanged; no commit needed."
          else
            git commit -m "Update daily ePaper period forecasts"
            git push
          fi
