
name: Generate ePaper Display

on:
  schedule:
    # 10 AM UTC = 5 AM Central Standard Time
    # 11 AM UTC = 5 AM Central Daylight Time
    - cron: "0 10,11 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "render.py"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      TZ: America/Chicago

    steps:
      - name: Check scheduled run time
        id: time_check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date +%H)" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 5 AM Central Time. Skipping rendering."
          fi

      - name: Checkout repository
        if: steps.time_check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.time_check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.time_check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ePaper image
        if: steps.time_check.outputs.run == 'true'
        run: |
          mkdir -p output
          python render.py --color --out output/display.png

      - name: Publish generated image
        if: steps.time_check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/display.png

          if git diff --cached --quiet; then
            echo "Image unchanged. No commit needed."
          else
            git commit -m "Update daily ePaper display"
            git push
          fi
